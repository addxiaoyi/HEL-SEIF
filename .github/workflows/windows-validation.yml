name: Historical Windows upgrade QA
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical-upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and verify the original and candidate installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows-historical-sources.ps1
      - name: Install, seed and upgrade a synthetic workspace
        shell: pwsh
        run: ./scripts/windows-historical-upgrade.ps1 -LegacyInstaller $env:HISTORICAL_LEGACY_EXE -CandidateInstaller $env:HISTORICAL_CANDIDATE_EXE -ReportDirectory historical-report
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-historical-upgrade
          path: historical-report/
          retention-days: 7
