name: Windows 安装验收（不发布）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 规范 Windows 临时目录
        shell: pwsh
        run: |
          $taskTempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve temporary directory' }
          "TEMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run terminal:build
      - run: npm run windows-shell:build
      - run: npm run desktop:dist -- --win --x64 --publish never
      - run: npm run desktop:online
      - name: 验证安装、启动、覆盖升级和卸载
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          ./scripts/windows-installation-qa.ps1 -Installer "release/v$version/Helself-$version-setup.exe"
      - name: 保存本次验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            screenshots/qa-installed-*.png
            release/v*/Helself-*-setup.exe
            release/v*/Helself-*-setup.exe.blockmap
            release/v*/latest.yml
          retention-days: 7
