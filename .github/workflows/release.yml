name: Windows 正式版
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 重新验证并发布的现有正式标签（例如 v1.7.1）
        required: true
        default: "v1.7.1"
        type: string
      signing_mode:
        description: Windows 发布模式；unsigned 明确发布未签名安装包
        required: true
        default: signed
        type: choice
        options:
          - signed
          - unsigned
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      HELSELF_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HELSELF_SIGNING_MODE: ${{ inputs.signing_mode || 'signed' }}
      HELSELF_REQUIRE_SIGNING: ${{ (inputs.signing_mode || 'signed') == 'signed' && '1' || '0' }}
      HELSELF_SIGN_CERT_SHA1: ${{ vars.HELSELF_SIGN_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 校验版本标签与源码
        shell: pwsh
        run: |
          if ($env:HELSELF_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable release tag' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:HELSELF_RELEASE_TAG) { throw 'Version tag mismatch' }
          $tagCommit = git rev-parse "refs/tags/$($env:HELSELF_RELEASE_TAG)^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag missing' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) { throw 'Release source mismatch' }
      - name: 检查 Windows 签名环境
        if: env.HELSELF_SIGNING_MODE == 'signed'
        shell: pwsh
        run: |
          $thumbprint = $env:HELSELF_SIGN_CERT_SHA1
          if ($thumbprint -notmatch '^[a-fA-F0-9]{40}$') { throw 'A release signing certificate thumbprint must be configured' }
          $thumbprint = $thumbprint.ToUpperInvariant()
          $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint"
          $now = Get-Date
          if (!$certificate.HasPrivateKey -or $now -lt $certificate.NotBefore -or $now -gt $certificate.NotAfter -or
              '1.3.6.1.5.5.7.3.3' -notin $certificate.EnhancedKeyUsageList.ObjectId.Value) {
            throw 'The release certificate must be current, have a private key, and allow code signing'
          }
          "HELSELF_SIGN_CERT_SHA1=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 规范 Windows 临时目录
        shell: pwsh
        run: |
          # 短文件名或大小写别名不能让文件系统测试的故障注入静默失效。
          $taskTempPath = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve temporary directory' }
          "TEMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$taskTempPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - name: 安装独立登录服务依赖
        working-directory: services/identity-login
        run: npm ci --omit=dev --ignore-scripts
      - name: 安装 Electron 运行时
        run: node node_modules/electron/install.js
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - name: 验证独立登录服务与出站代理
        working-directory: services/identity-login
        run: npm test
      - run: node scripts/updater-engine-integration.mjs
      - run: npm run desktop:dist
      - name: 构建原生在线安装器并验证真实安装与卸载
        env:
          HELSELF_INSTALLER_REAL_TEST: "1"
        run: npm run desktop:online
      - name: 生成 Windows 便携版
        run: npm run desktop:portable
      - name: 验证改名后的安装目录兼容
        run: node scripts/installer-directory-integration.mjs
      - name: 验证自启偏好与卸载清理
        run: node scripts/installer-startup-integration.mjs
      - name: 验证正式版彩色图标与任务栏分组
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/brand-icons-integration.mjs "release/v$version/win-unpacked/Helself.exe"
      - name: 验证本机默认监控与 Markdown 导入
        run: |
          node scripts/local-usage-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/markdown-import-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证文档关系与 Agent 修改的正式程序接口
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/workspace-v150-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/agent-access-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vault-usability-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/security-patch-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/sidebar-centering-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/storage-clear-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/backup-integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run extension:build
      - name: 验证正式程序的密码迁移与浏览器接口
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/passwords-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/identity-totp-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/main-identity-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/local-usage-packaged-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/subscription-desktop-integration.mjs "release/v$version/win-unpacked/Helself.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证浏览器插件真实交互
        run: node scripts/browser-companion-integration.mjs
      - name: 验证签名状态及在线更新载荷
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = "release/v$version"
          $installer = "$directory/Helself-$version-setup.exe"
          $online = "$directory/Helself-$version-online-setup.exe"
          if (!(Test-Path $online)) { throw 'Online installer missing' }
          $portable = "$directory/Helself-$version-portable-x64.zip"
          if (!(Test-Path $portable)) { throw 'Portable archive missing' }
          $receipt = "$directory/WINDOWS-SIGNATURES.json"
          if ($env:HELSELF_SIGNING_MODE -eq 'unsigned') {
            ./scripts/verify-windows-release-signatures.ps1 -Version $version -Directory $directory -Receipt $receipt -AllowUnsigned
          } else {
            ./scripts/verify-windows-release-signatures.ps1 -Version $version -Directory $directory -Receipt $receipt
          }
      - name: 校验文件与发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $directory = "release/v$version"
          $installer = "$directory/Helself-$version-setup.exe"
          $online = "$directory/Helself-$version-online-setup.exe"
          $portable = "$directory/Helself-$version-portable-x64.zip"
          $receipt = "$directory/WINDOWS-SIGNATURES.json"
          $extension = "$directory/Helself-$version-browser-extension.zip"
          Compress-Archive -Path "$directory/helself-browser-extension/*" -DestinationPath $extension
          $metadata = "$directory/latest.yml"
          $blockmap = "$installer.blockmap"
          $assets = @($installer, $online, $portable, $extension, $metadata, $blockmap, $receipt)
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          gh release create "v$version" @assets "$directory/SHA256SUMS.txt" --verify-tag --title "Helself $version" --notes-file "docs/releases/v$version.md"

  # 网页版镜像：Windows 正式版全部检查通过后，推送到 ghcr.io/<owner>/helself-web:<版本> 与 latest。
  web-image:
    needs: windows
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/web-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
